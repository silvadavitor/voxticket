# Papel do CloudFront + ALB: / → bucket do front no MiniStack; /api/tickets, /api/tenants e /api/* → serviços.
otel_exporter {
    endpoint otel-collector:4317;
}
otel_service_name gateway;
otel_trace_context propagate;
# Span quando o navegador manda traceparent ou em escrita (POST de áudio por curl/scripts). GETs de polling ficam
# de fora. Atenção: com o span desligado o nginx ainda repassa um traceparent "não amostrar", e o serviço
# obedece; por isso o POST sem traceparent PRECISA ligar aqui, senão o começo da saga some do trace.
map "$http_traceparent|$request_method" $otel_ligado {
    default                      off;
    "~^[^|]+\|"                  on;
    "~^\|(POST|PUT|PATCH|DELETE)$" on;
}
otel_trace $otel_ligado;

server {
    listen 80;

    # resolver do Docker: o nginx sobe mesmo se os serviços ainda não existirem
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $s3      http://ministack:4566/voxticket-local-frontend;
    set $request_svc http://request-service:8080;
    set $ticket_svc  http://ticket-service:8080;
    set $quota_svc   http://quota-service:8080;

    client_max_body_size 25m;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    # /health de cada serviço para os indicadores do topo do front. Lista fechada: o nome vira host do proxy.
    location ~ ^/api/health/(quota-service|transcription-worker|categorization-service|ticket-service|notification-service)$ {
        proxy_pass http://$1:8080/health;
    }

    location /api/tickets {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $ticket_svc;
    }

    location /api/tenants {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $quota_svc;
    }

    location /api/ {
        otel_span_name "gateway $request_method $uri";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $request_svc;
    }

    location = / {
        proxy_pass $s3/index.html;
    }

    location / {
        proxy_pass $s3$uri;
        proxy_intercept_errors on;
        error_page 403 404 = @index;
    }

    location @index {
        proxy_pass $s3/index.html;
    }
}
