# "CloudFront local" + gateway da API (mesmo papel do CloudFront + ALB na AWS).
#   /*             → arquivos do bucket voxticket-local-frontend no S3 do MiniStack (publicados por Terraform)
#   /api/audios*   → request-service   (prefixo /api removido)
#   /api/tickets*  → ticket-service
#   /api/health    → request-service
# OpenTelemetry: o gateway é o primeiro serviço do trace e continua o traceparent que o front envia.
otel_exporter {
    endpoint otel-collector:4317;
}
otel_service_name gateway;
otel_trace_context propagate;
# só gera span quando o navegador manda traceparent (envio de áudio): status e arquivos não poluem o Tempo
map $http_traceparent $otel_ligado {
    ""      off;
    default on;
}
otel_trace $otel_ligado;

server {
    listen 80;

    # resolver do Docker: o nginx sobe mesmo se os serviços ainda não existirem
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $s3      http://ministack:4566/voxticket-local-frontend;
    set $request_svc http://request-service:8080;
    set $ticket_svc  http://ticket-service:8080;

    client_max_body_size 25m;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    location /api/tickets {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $ticket_svc;
    }

    location /api/ {
        otel_span_name "gateway $request_method $uri";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $request_svc;
    }

    location = / {
        proxy_pass $s3/index.html;
    }

    location / {
        proxy_pass $s3$uri;
        proxy_intercept_errors on;
        error_page 403 404 = @index;
    }

    location @index {
        proxy_pass $s3/index.html;
    }
}
