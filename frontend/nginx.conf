# "CloudFront local": mesmo papel da distribuição na AWS.
#   /*      → arquivos do bucket voxticket-local-frontend no S3 do MiniStack (publicados por Terraform)
#   /api/*  → request-service (prefixo /api removido, como a CloudFront Function faz na AWS)
server {
    listen 80;

    # resolver do Docker: o nginx sobe mesmo se o request-service ainda não existir
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $s3  http://ministack:4566/voxticket-local-frontend;
    set $api http://request-service:8080;

    client_max_body_size 25m;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location = / {
        proxy_pass $s3/index.html;
    }

    location / {
        proxy_pass $s3$uri;
        proxy_intercept_errors on;
        error_page 403 404 = @index;   # rota desconhecida → index.html (como SPA)
    }

    location @index {
        proxy_pass $s3/index.html;
    }
}
