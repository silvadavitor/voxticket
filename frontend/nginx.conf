# "CloudFront local" + gateway da API (mesmo papel do CloudFront + ALB na AWS).
#   /*             → arquivos do bucket voxticket-local-frontend no S3 do MiniStack (publicados por Terraform)
#   /api/audios*   → request-service   (prefixo /api removido)
#   /api/tickets*  → ticket-service
#   /api/tenants*  → quota-service     (cadastro de clientes)
#   /api/health    → request-service
server {
    listen 80;

    # resolver do Docker: o nginx sobe mesmo se os serviços ainda não existirem
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $s3      http://ministack:4566/voxticket-local-frontend;
    set $request_svc http://request-service:8080;
    set $ticket_svc  http://ticket-service:8080;
    set $quota_svc   http://quota-service:8080;

    client_max_body_size 25m;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    location /api/tickets {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $ticket_svc;
    }

    location /api/tenants {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $quota_svc;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $request_svc;
    }

    location = / {
        proxy_pass $s3/index.html;
    }

    location / {
        proxy_pass $s3$uri;
        proxy_intercept_errors on;
        error_page 403 404 = @index;
    }

    location @index {
        proxy_pass $s3/index.html;
    }
}
