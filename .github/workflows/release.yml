name: release

# Reutilizável: aplica a infra (no-op se nada mudou), roda as tasks de init e atualiza o ECS
# para a tag informada. As imagens já devem estar no ECR (build-images).

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: aws
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      BUDGET_EMAILS: ${{ vars.BUDGET_EMAILS }}
      API_ALLOWED_CIDRS: ${{ vars.API_ALLOWED_CIDRS || '0.0.0.0/0' }}
      IMAGE_TAG: ${{ inputs.tag }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
      DD_HOST: https://api.${{ vars.DD_SITE || 'datadoghq.com' }}
      TG_NON_INTERACTIVE: "true"
    defaults:
      run:
        working-directory: infra/live/aws
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-infra
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Infra base + ecs-init (no-op se nada mudou)
        run: terragrunt run --all --filter '!./github-oidc' --filter '!./ecs-services' --filter '!./datadog' apply

      - name: Tasks de init (databases/usuários no RDS, filas no Amazon MQ), idempotentes
        run: ../../scripts/run-init-tasks.sh

      - name: Serviços no ECS (só os que têm Dockerfile)
        run: |
          DEPLOY_SERVICES=$(cd ../../../services && for d in */; do if [ -f "${d}Dockerfile" ]; then printf '%s,' "${d%/}"; fi; done)
          export DEPLOY_SERVICES="${DEPLOY_SERVICES%,}"
          if [ -z "$DEPLOY_SERVICES" ]; then
            echo "::notice::Nenhum serviço com Dockerfile ainda; ecs-services não aplicado."
            exit 0
          fi
          echo "Serviços: $DEPLOY_SERVICES"
          terragrunt run --working-dir ecs-services -- apply -auto-approve

      - name: Dashboard e monitores Datadog
        if: env.DD_API_KEY != '' && env.DD_APP_KEY != ''
        run: terragrunt run --working-dir datadog -- apply -auto-approve

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Release \`${IMAGE_TAG::7}\`"
            echo
            echo "API: $(terragrunt run --working-dir ecs-services --tf-forward-stdout -- output -raw api_url 2>/dev/null || echo 'n/d')"
          } >> "$GITHUB_STEP_SUMMARY"
